<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sonia Malik · Prototypes</title>
<meta name="description" content="Work-sample prototypes by Sonia Malik.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3F5; --surface:#FFFFFF; --fg:#1E1A1F; --muted:#5F5761; --line:#DED7DF; --accent:#6B3A6E; --accent-soft:#F1E6F1; --accent-ink:#552A58}
@media (prefers-color-scheme: dark){ :root{--bg:#151216; --surface:#1E1A1F; --fg:#EEE8EF; --muted:#B5ABB7; --line:#362F38; --accent:#CE9FD1; --accent-soft:#3A273C; --accent-ink:#E2BEE4; color-scheme:dark} }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font-family:"Public Sans","Segoe UI",Arial,sans-serif; line-height:1.6; display:grid; place-items:center; padding:24px}
main{max-width:560px; width:100%; background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:14px; padding:32px 28px; display:grid; gap:14px}
h1{font-family:"Source Serif 4",Georgia,serif; font-weight:500; font-size:clamp(1.6rem,5vw,2.1rem); line-height:1.2; margin:0}
p{margin:0; color:var(--muted)}
.links{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px}
.links a{display:inline-block; text-decoration:none; font-weight:600; font-size:.9rem; color:var(--accent-ink); background:var(--accent-soft); border-radius:999px; padding:7px 16px}
.links a:hover{outline:1px solid var(--accent)}
footer{font-size:.78rem; color:var(--muted); margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>Sonia Malik · Prototypes</h1>
  <p>Work-sample prototypes of AI engineering and governance operating models, shared individually with each conversation.</p>
  <div class="links">
    <a href="mailto:sonia.malik78@gmail.com">Email</a>
    <a href="https://www.linkedin.com/in/sonia-malik-b059705" rel="noopener">LinkedIn</a>
  </div>
  <footer>© 2026 Sonia Malik</footer>
</main>
</body>
</html>
